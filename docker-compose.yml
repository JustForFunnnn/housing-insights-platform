services:
  prediction-service:
    build:
      context: .
      dockerfile: prediction-service/Dockerfile
    image: housing-insights/prediction-service:local
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
