services:
  prediction-service:
    build:
      context: .
      dockerfile: prediction-service/Dockerfile
    image: housing-insights/prediction-service:local
    ports:
      - "9000:9000"
    environment:
      PROPERTY_METADATA_PATH: /app/contracts/property-metadata.json
    volumes:
      - ./contracts/property-metadata.json:/app/contracts/property-metadata.json:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:9000/api/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  estimator-service:
    build:
      context: .
      dockerfile: estimator-service/Dockerfile
    image: housing-insights/estimator-service:local
    ports:
      - "9001:9001"
    environment:
      PREDICTION_SERVICE_URL: http://prediction-service:9000
      PREDICTION_SERVICE_TIMEOUT_SECONDS: "5"
      ESTIMATOR_DATABASE_URL: >-
        postgresql+asyncpg://${POSTGRES_USER:-estimator}:${POSTGRES_PASSWORD:-estimator}@estimator-database:5432/${POSTGRES_DB:-estimator}
      PROPERTY_METADATA_PATH: /app/contracts/property-metadata.json
    volumes:
      - ./contracts/property-metadata.json:/app/contracts/property-metadata.json:ro
    depends_on:
      prediction-service:
        condition: service_healthy
      estimator-database:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:9001/api/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  estimator-database:
    image: postgres:17-alpine
    ports:
      - "15432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-estimator}
      POSTGRES_USER: ${POSTGRES_USER:-estimator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-estimator}
    volumes:
      - estimator-database-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  market-service:
    build:
      context: .
      dockerfile: market-service/Dockerfile
    image: housing-insights/market-service:local
    ports:
      - "9002:9002"
    environment:
      MARKET_DATASET_PATH: /app/data/House Price Dataset.csv
      PROPERTY_METADATA_PATH: /app/contracts/property-metadata.json
      PREDICTION_SERVICE_URL: http://prediction-service:9000
      PREDICTION_SERVICE_TIMEOUT_SECONDS: "5"
    volumes:
      - ./contracts/property-metadata.json:/app/contracts/property-metadata.json:ro
    depends_on:
      - prediction-service
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - http://localhost:9002/api/health
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  insights-portal:
    build:
      context: ./insights-portal
      dockerfile: Dockerfile
    image: housing-insights/insights-portal:local
    ports:
      - "9100:9100"
    environment:
      ESTIMATOR_SERVICE_URL: http://estimator-service:9001
      MARKET_SERVICE_URL: http://market-service:9002
      PORT: "9100"
    depends_on:
      estimator-service:
        condition: service_healthy
      market-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://localhost:9100/api/health').then(response => {
            if (!response.ok) process.exit(1)
          }).catch(() => process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  estimator-database-data:
