server:
  port: 9002

spring:
  application:
    name: market-service
  cache:
    type: caffeine
    cache-names: filteredProperties
    caffeine:
      spec: maximumSize=256,expireAfterAccess=30m
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false

springdoc:
  swagger-ui:
    path: /docs

market:
  dataset-path: "${MARKET_DATASET_PATH:../data/House Price Dataset.csv}"
  property-metadata-path: "${PROPERTY_METADATA_PATH:../contracts/property-field-metadata.json}"
  prediction:
    base-url: "${PREDICTION_SERVICE_URL:http://localhost:9000}"
    timeout: "${PREDICTION_SERVICE_TIMEOUT_SECONDS:5}s"

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level request_id=%X{request_id:--} %logger{36} - %msg%n"
  level:
    com.housinginsights.market: INFO
