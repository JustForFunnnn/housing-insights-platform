[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "housing-common"
version = "0.1.0"
description = "Shared Python infrastructure for Housing Insights services."
requires-python = ">=3.12"
dependencies = [
    "asgi-correlation-id>=4.3,<5",
    "pydantic>=2.10,<3",
    "starlette>=0.40,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
