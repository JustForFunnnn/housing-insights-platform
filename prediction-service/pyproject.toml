[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "prediction-service"
version = "0.1.0"
description = "Train and serve a linear-regression housing price model."
requires-python = ">=3.12"
dependencies = [
    "asgi-correlation-id>=4.3,<5",
    "fastapi>=0.115,<1",
    "joblib>=1.4,<2",
    "numpy>=2,<2.5",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.10,<3",
    "scikit-learn>=1.5,<2",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.7,<3",
    "pytest>=8.3,<9",
]

[project.scripts]
housing-train = "prediction_service.training:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
